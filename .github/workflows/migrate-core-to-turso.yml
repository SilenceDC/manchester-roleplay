name: Migrate Manchester core D1 data to Turso

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manchester-core-turso-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run staged Manchester core D1 import'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Export Manchester core D1 and import into Turso
        env:
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
          TURSO_DATABASE: ${{ secrets.TURSO_DATABASE }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          CF_ACCOUNT_ID: "4554703e1e32b26e50be67bf7e0475ec"
          D1_DATABASE_ID: "6479d69d-60f9-44b0-a705-5490346749a4"
        run: |
          set -euo pipefail
          node <<'NODE'
          const tables = [
            "announcements", "app_state", "ban_bolos", "cad_call_events",
            "cad_calls", "cad_unit_members", "cad_units", "formal_warnings",
            "moderation_logs", "retention_runs", "schema_migrations"
          ];
          const token = process.env.TURSO_DATABASE;
          const rawUrl = process.env.TURSO_DATABASE_URL;
          const cfToken = process.env.CLOUDFLARE_D1_READ_TOKEN;
          if (!token || !rawUrl || !cfToken) {
            throw new Error("A required repository secret is missing. Check TURSO_DATABASE, TURSO_DATABASE_URL and CLOUDFLARE_D1_READ_TOKEN.");
          }

          const normalizedUrl = rawUrl.replace(/^libsql:\/\//i, "https://");
          const parsedUrl = new URL(normalizedUrl);
          if (parsedUrl.protocol !== "https:") throw new Error("Turso database URL must use libsql:// or https://.");
          const tursoEndpoint = parsedUrl.origin + "/v2/pipeline";
          const cfBase = `https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/d1/database/${process.env.D1_DATABASE_ID}/export`;

          async function cfExport(body) {
            const response = await fetch(cfBase, {
              method: "POST",
              headers: { "Authorization": `Bearer ${cfToken}`, "Content-Type": "application/json" },
              body: JSON.stringify(body)
            });
            const data = await response.json();
            if (!response.ok || data.success !== true) {
              const message = (data.errors || []).map(x => x.message).join("; ") || `Cloudflare export failed with HTTP ${response.status}`;
              throw new Error(message);
            }
            return data.result;
          }

          let exportState = await cfExport({
            output_format: "polling",
            dump_options: { compatibility: "sqlite3_cli_only", tables }
          });
          for (let attempt = 0; exportState.status === "active" && attempt < 60; attempt++) {
            await new Promise(resolve => setTimeout(resolve, 2000));
            exportState = await cfExport({ output_format: "polling", current_bookmark: exportState.at_bookmark });
          }
          if (exportState.status !== "complete" || !exportState.result?.signed_url) {
            throw new Error("Cloudflare did not complete the D1 export in time.");
          }

          const dumpResponse = await fetch(exportState.result.signed_url);
          if (!dumpResponse.ok) throw new Error(`Could not download the D1 export (HTTP ${dumpResponse.status}).`);
          const dump = await dumpResponse.text();
          if (!dump.trim()) throw new Error("The D1 export was empty.");

          function splitSql(source) {
            const statements = [];
            let current = "", quote = null, lineComment = false, blockComment = false;
            for (let i = 0; i < source.length; i++) {
              const ch = source[i], next = source[i + 1];
              if (lineComment) {
                if (ch === "\n") { lineComment = false; current += "\n"; }
                continue;
              }
              if (blockComment) {
                if (ch === "*" && next === "/") { blockComment = false; i++; }
                continue;
              }
              if (quote) {
                current += ch;
                if (quote === "]" && ch === "]") quote = null;
                else if (ch === quote) {
                  if (source[i + 1] === quote && quote !== "]") current += source[++i];
                  else quote = null;
                }
                continue;
              }
              if (ch === "-" && next === "-") { lineComment = true; i++; continue; }
              if (ch === "/" && next === "*") { blockComment = true; i++; continue; }
              if (ch === "'" || ch === '"' || ch === "`") { quote = ch; current += ch; continue; }
              if (ch === "[") { quote = "]"; current += ch; continue; }
              if (ch === ";") {
                if (current.trim()) statements.push(current.trim());
                current = "";
              } else current += ch;
            }
            if (current.trim()) statements.push(current.trim());
            return statements;
          }

          const statements = splitSql(dump).filter(sql => !/^\s*\. /.test(sql));
          const safeStatements = [];
          const expected = Object.fromEntries(tables.map(t => [t, 0]));
          for (let sql of statements) {
            if (/^PRAGMA\s+foreign_keys\s*=/i.test(sql) || /^BEGIN\b/i.test(sql) || /^COMMIT\b/i.test(sql) || /^ROLLBACK\b/i.test(sql)) {
              safeStatements.push(sql);
              continue;
            }
            if (/^(CREATE\s+TABLE)\s+(?!IF\s+NOT\s+EXISTS)/i.test(sql)) {
              sql = sql.replace(/^(CREATE\s+TABLE)\s+/i, "$1 IF NOT EXISTS ");
            } else if (/^(CREATE\s+(?:UNIQUE\s+)?INDEX)\s+(?!IF\s+NOT\s+EXISTS)/i.test(sql)) {
              sql = sql.replace(/^(CREATE\s+(?:UNIQUE\s+)?INDEX)\s+/i, "$1 IF NOT EXISTS ");
            }
            if (/^(INSERT\s+INTO)\s+(?:"?sqlite_sequence"?)/i.test(sql)) continue;
            const insertMatch = sql.match(/^INSERT\s+INTO\s+["'`]?([a-zA-Z0-9_]+)["'`]?/i);
            if (insertMatch && Object.hasOwn(expected, insertMatch[1])) {
              expected[insertMatch[1]]++;
              sql = sql.replace(/^INSERT\s+INTO\s+/i, "INSERT OR REPLACE INTO ");
            }
            safeStatements.push(sql);
          }
          if (!safeStatements.some(sql => /^CREATE\s+TABLE\b/i.test(sql))) {
            throw new Error("The D1 export did not contain the expected application schema.");
          }

          const requests = safeStatements.map(sql => ({ type: "execute", stmt: { sql } }));
          requests.push({ type: "close" });
          const importResponse = await fetch(tursoEndpoint, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ baton: null, requests })
          });
          if (!importResponse.ok) throw new Error(`Turso import request failed with HTTP ${importResponse.status}.`);
          const imported = await importResponse.json();
          const failed = (imported.results || []).find(item => item.type === "error");
          if (failed) throw new Error("Turso rejected part of the import: " + (failed.error?.message || "SQL execution error"));

          const verifyRequests = tables.map(table => ({
            type: "execute",
            stmt: { sql: `SELECT COUNT(*) AS count FROM "${table}"` }
          }));
          verifyRequests.push({ type: "close" });
          const verifyResponse = await fetch(tursoEndpoint, {
            method: "POST",
            headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ baton: null, requests: verifyRequests })
          });
          if (!verifyResponse.ok) throw new Error(`Turso verification failed with HTTP ${verifyResponse.status}.`);
          const verified = await verifyResponse.json();
          const verifyError = (verified.results || []).find(item => item.type === "error");
          if (verifyError) throw new Error("Turso verification query failed.");

          const actual = {};
          for (let i = 0; i < tables.length; i++) {
            const result = verified.results[i]?.response?.result;
            const cell = result?.rows?.[0]?.[0];
            actual[tables[i]] = Number(cell?.value ?? cell ?? 0);
          }
          console.log("Manchester core D1 → Turso import completed.");
          console.log("Source export:", exportState.result.filename);
          console.log("Rows in Turso after import:");
          for (const table of tables) {
            console.log(`  ${table}: ${actual[table]} (export statements: ${expected[table]})`);
            if (actual[table] !== expected[table]) throw new Error(`Row-count verification mismatch for ${table}.`);
          }
          console.log("D1 source was exported read-only and was not modified.");
          console.log("Live Workers and production bindings were not changed.");
          NODE
